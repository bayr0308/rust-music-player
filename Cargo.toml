[package]
name = "mellow"
version = "0.2.0"
edition = "2024"
description = "Mellow — a minimal, folder-based desktop music player"
license = "MIT"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui-phosphor = "0.11.0"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-all"] }
lofty = "0.22.4"
rfd = "0.15.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rand = "0.9"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

[dev-dependencies]
tempfile = "3"
hound = "3.5"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[[bin]]
name = "mellow"
path = "src/main.rs"
